apis:
- aid: momo:aio-payment-gateway
  name: MoMo All-in-One Payment Gateway (AIO v2)
  description: 'The MoMo All-in-One (AIO v2) merchant payment gateway. One integration
    covers MoMo e-wallet, domestic ATM card, credit card, Apple Pay, Google Pay, Buy
    Now Pay Later, Quick Pay POS scanner, collection links and static/dynamic QR acceptance,
    plus transaction query, two-step capture/cancel confirm, reverse and refund, tokenisation
    (account binding and subscription) and single/batch disbursement. All calls are
    POST JSON signed with HMAC-SHA256; results are pushed back over IPN.'
  humanURL: https://developers.momo.vn/v3/docs/payment/guides/payment-with-aio/
  baseURL: https://payment.momo.vn/v2/gateway/api
  tags:
  - Payments
  - Payment Gateway
  - Refunds
  - Disbursement
  - Tokenization
  properties:
  - type: Documentation
    url: https://developers.momo.vn/v3/docs/payment/guides/payment-with-aio/
  - type: APIReference
    url: https://developers.momo.vn/v3/docs/payment/api/wallet/onetime/
  - type: Postman
    url: https://developers.momo.vn/v3/docs/payment/api/other/postman/
  - type: Sandbox
    url: https://developers.momo.vn/v3/docs/payment/onboarding/test-instructions/
- aid: momo:business-page-openapi
  name: MoMo Business Page OpenAPI
  description: 'Server-to-server API for operating a MoMo Business Page: list and
    read managed pages, update page detail, images, logo, opening times, utilities
    and ambiences, publish and read posts and their comments, read ratings and reviews,
    build customer segments, register and send customer-care and automated notification
    messages, and pull page view/interaction/payment reports. Authenticated with a
    Partner Id plus an X-API-KEY scoped to the permission groups granted in the MoMo
    for Business portal.'
  humanURL: https://developers.momo.vn/v3/docs/business-page/overall/
  baseURL: https://business.momo.vn/api
  tags:
  - Business Page
  - Messaging
  - Content
  - Reporting
  properties:
  - type: Documentation
    url: https://developers.momo.vn/v3/docs/business-page/overall/
  - type: GettingStarted
    url: https://developers.momo.vn/v3/docs/business-page/start/
- aid: momo:voucher-distribution
  name: MoMo Voucher Distribution API
  description: 'API for creating and distributing promotion campaigns and voucher
    codes to MoMo users, and for reconciling redemption. Create and update campaigns,
    upload voucher codes by file, query campaign and voucher-code status, and post
    redemption results back to MoMo. Authenticated with clientId/clientSecret exchanged
    for a 24-hour bearer access token; every request carries an X-Request-Id UUID.'
  humanURL: https://developers.momo.vn/v3/docs/voucher-distribution/overall/
  baseURL: https://business.momo.vn/api
  tags:
  - Vouchers
  - Promotions
  - Loyalty
  properties:
  - type: Documentation
    url: https://developers.momo.vn/v3/docs/voucher-distribution/overall/
  - type: GettingStarted
    url: https://developers.momo.vn/v3/docs/voucher-distribution/integration-documentation/
- aid: momo:mini-app-open-api
  name: MoMo Mini App Open API
  description: 'The M_Service Open Platform server-to-server API used by Mini Apps
    embedded in the MoMo app. Exchange a user authorisation code for a short-lived
    access token, read the user profile fields the user consented to share, and push
    notifications into the MoMo app. Requests carry an OAuth 2.0-style bearer JWT
    plus an OP-Signature (SHA256withRSA over data + M-Timestamp + openSecretKey) and
    optional AES payload encryption under an RSA-wrapped symmetric key.'
  humanURL: https://developers.momo.vn/v3/docs/app-center/development-guideline/components-api-sdk/open-api/api-specifications/
  baseURL: https://openapi.momo.vn/gateway/open/v1
  tags:
  - Mini App

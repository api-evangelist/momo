  official: true
  version: 0.158.1-beta.2
  published: '2026-03-31'
- language: javascript
  registry: npm
  name: '@momo-platform/component-kits'
  url: https://www.npmjs.com/package/@momo-platform/component-kits
  install: npm install @momo-platform/component-kits
  official: true
  version: 1.3.26
  published: '2022-05-23'
  note: >-

aid: momo
name: MoMo
description: 'MoMo is Vietnam''s largest mobile-money and e-wallet platform, operated
  by Online Mobile Services Joint Stock Company (Cong ty Co phan Dich vu Di dong Truc
  tuyen, "M_Service"), founded in 2007 and licensed by the State Bank of Vietnam for
  e-wallet, money transfer and collection/disbursement services. Alongside the consumer
  wallet it runs a merchant payments business whose public developer surface at developers.momo.vn
  documents the All-in-One (AIO v2) Payment Gateway for wallet, domestic ATM card,
  credit card, Apple Pay, Google Pay, Buy Now Pay Later, POS Quick Pay and static/dynamic
  QR acceptance, single and batch disbursement, collection links, and tokenised one-click
  and subscription payments. It also publishes a Business Page OpenAPI, a Voucher
  Distribution API and a Mini App Open Platform for third-party apps embedded inside
  the MoMo app. Integration is HMAC-SHA256 signed with RSA and AES payload encryption,
  uses requestId-based idempotency and server-to-server IPN callbacks, and is distributed
  as fourteen public Postman collections plus first-party PHP, Java and mobile SDKs.'

  install: npm install @momo-kits/core
  runtime: React Native
  version: 0.152.1-beta.2
  published: '2025-11-14'
  members_note: >-
    The @momo-kits npm organisation publishes ~50 component packages. Actively
    released members observed on 2026-08-26 include native-kits (ComposeKit,
    0.162.34, 2026-08-11), foundation (0.158.1-beta.2, 2026-03-31), qrcode,

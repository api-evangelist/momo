generated: '2026-08-26'
method: searched
source: https://developers.momo.vn/v3/docs/payment/api/result-handling/resultcode/
api: momo:aio-payment-gateway
format: vendor-numeric
note: MoMo does not use RFC 9457 problem+json. Every AIO v2 response carries a numeric `resultCode` plus
  a localised `message` (vi or en, selected by the request's `lang` field) inside the ordinary JSON response
  body; the HTTP status carries a coarse signal only (2xx received and processed, 4xx caller error, 5xx
  server/connection). The same resultCode vocabulary is used in synchronous responses, in the IPN callback
  body and in refund sub-results, which is what makes it worth cataloguing as one registry.
envelope:
  code_field: resultCode
  message_field: message
  correlation_fields:
  - requestId
  - orderId
  - transId
  - responseTime
  language_control: lang (vi|en) on the request
  example:
    partnerCode: MOMO
    orderId: OD1672315832109
    requestId: RE1672315832109
    amount: 350000
    transId: 2820086739
    resultCode: 0
    message: Successful.
    responseTime: 1672315843986
semantics:
  final_status: '`Final Status` = Yes means the result is terminal and the code is idempotent: retrying
    the same requestId returns the same terminal result. `Final Status` = No means the outcome is not
    settled; retrying with the same requestId returns error 40 ''Duplicated requestId'' rather than repeating
    the action.'
  pending_codes:
  - 7000
  - 7002
  - 9000
  - 1000
  success_codes:
  - 0
  authorized_code: 9000
classes:
  System error: MoMo-side or configuration fault; the merchant usually cannot fix it in-request.
  Merchant error: The request itself is wrong — format, amount, duplicate identifier, ineligible refund.
  User error: The end user or their funding instrument declined, is limited, or is unverified.
  Pending: Not yet terminal; wait for the IPN or re-query.

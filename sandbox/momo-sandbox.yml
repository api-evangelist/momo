tooling:
  postman:
    collections: 14
    index: postman/_index.yml
    docs: https://developers.momo.vn/v3/docs/payment/api/other/postman/
    note: >-
      Each collection ships a Postman environment preloaded with MoMo's shared
      test-merchant partnerCode, accessKey, secretKey and RSA public key. MoMo
      labels that merchant "DO NOT USE FOR INTERNAL TEST. Merchant integrate test
      payment."
  demo_checkout:
    note: MoMo links an end-to-end "Demo Checkout" and a "Demo ATM Payment" walkthrough from the Test Instructions page.
not_published:
  test_clocks: false
  time_simulation: >-
    No test clock or time-travel facility is documented — subscription and
    tokenisation renewals cannot be fast-forwarded.
  fixture_triggers: >-
    No trigger/fixture API. Failure scenarios are reached by choosing the
    matching test card, not by firing an event.
  self_serve_signup: >-
    Test credentials require an M4B merchant registration; there is no anonymous
    sandbox key.

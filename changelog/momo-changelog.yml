note: >-
  MoMo publishes dated changelogs for exactly two things — the Mini App CLI and
  the Mini API / MoMo Platform — and BOTH stopped in 2022. There is no changelog,
  release-notes page or version-history page for the AIO v2 payment gateway, the
  Business Page OpenAPI or the Voucher Distribution API, which are the three
  surfaces most integrators actually depend on. Undated in-page notes are the
  only other signal (e.g. the production IP allowlist carries "New Update from
  11 Sep 2024" and "New Update from 10 Apr 2026" annotations).

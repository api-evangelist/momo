generated: '2026-08-26'
method: searched
source: >-
  https://github.com/momo-wallet (MoMo's own GitHub org, blog field set to
  https://developers.momo.vn/), plus the registry metadata endpoints for each
  package (packagist.org, search.maven.org, registry.npmjs.org) and MoMo's own
  Component Kits and Mini App CLI installation pages on developers.momo.vn.
note: >-
  MoMo ships two distinct package families and they are in very different
  states. The MERCHANT PAYMENT SDKs (PHP, Java, mobile) are stale: the PHP
  package has never been tagged and its only branch was last touched in
  February 2022, the Java artifact on Maven Central is still 1.0 from July 2019,
  and the iOS/Android SDK is distributed from a git branch rather than a
  registry. The MINI APP / Component Kits family on npm is actively released,
  with @momo-kits/native-kits published in August 2026. There is no first-party
  JavaScript/Node, Python, Go, Ruby, .NET or Rust client for the AIO v2 payment
  gateway; the momo-wallet/payment repository ships example code in those
  languages but publishes nothing to a registry.
packages:
- language: php
  registry: packagist
  name: mservice/payment
  url: https://packagist.org/packages/mservice/payment
  install: composer require mservice/payment
  source_code: https://github.com/momo-wallet/php
  official: true
  version: dev-master
  published: '2022-02-18'
  note: >-
    No tagged or stable release has ever been published — dev-master is the only
    version Packagist knows about, last updated 2022-02-18. A consumer pinning
    this dependency is pinning a moving branch.
- language: java
  registry: maven
  name: io.github.momo-wallet:momopayment
  url: https://central.sonatype.com/artifact/io.github.momo-wallet/momopayment
  install: '<dependency><groupId>io.github.momo-wallet</groupId><artifactId>momopayment</artifactId><version>1.0</version></dependency>'
  source_code: https://github.com/momo-wallet/java
  official: true
  version: '1.0'
  published: '2019-07-16'
  note: >-
    Single version, published 2019-07-16 — seven years older than the AIO v2
    gateway it wraps. The repository README still points integrators at an
    ossrh snapshots repository.
- language: swift
  registry: cdn
  name: MomoiOSSwiftSdk
  url: https://github.com/momo-wallet/mobile-sdk
  install: 'pod "MomoiOSSwiftSdk", :git => "https://github.com/momo-wallet/mobile-sdk.git", :branch => "release_swift", submodules: true'
  source_code: https://github.com/momo-wallet/mobile-sdk
  official: true
  version: null
  published: null
  note: >-
    Not published to CocoaPods trunk or any registry — the podspec is consumed
    directly from a git branch (release_swift for Swift, release_objc for
    Objective-C), so there is no version metadata to read and the dependency
    floats with the branch. Repository last pushed 2023-01-26.

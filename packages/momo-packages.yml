- language: javascript
  registry: npm
  name: '@momo-miniapp/cli'
  url: https://www.npmjs.com/package/@momo-miniapp/cli
  install: npm i @momo-miniapp/cli -g
  official: true
  version: null
  published: null
  note: >-
    Probed registry.npmjs.org/@momo-miniapp/cli on 2026-08-26 and got HTTP 404 —
    the package is NOT on the public npm registry. MoMo's own installation page
    tells developers to copy an "NPM Configuration" out of the Mini App
    dashboard before installing, so the scope resolves against a private,
    credentialed registry. Version and release date are therefore unreadable
    without a Mini App Center account; the docs' own changelog stops at 0.0.79
    (19 May 2022).

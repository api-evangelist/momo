generated: '2026-08-26'
method: searched
source: >-
  https://developers.momo.vn/v3/docs/payment/onboarding/test-instructions/,
  https://developers.momo.vn/v3/docs/payment/onboarding/integration-process/,
  https://developers.momo.vn/v3/docs/payment/api/other/postman/
api: momo:aio-payment-gateway
note: >-
  Every value in this file is published verbatim by MoMo on its own Test
  Instructions page. Nothing here is invented. MoMo runs a full parallel
  environment rather than a test-mode flag: separate host, separate credentials,
  and a separately distributed test build of the consumer wallet app.
environments:
- name: test
  host: https://test-payment.momo.vn
  purpose: Integration, testing and debugging
- name: production
  host: https://payment.momo.vn
  purpose: Live end users
separate_credentials: true
credential_note: >-
  partnerCode, accessKey, secretKey and the RSA public key are DIFFERENT per
  environment and are issued from the MoMo for Business (M4B) portal. Production
  credentials are only released after test-environment UAT results are shared
  with and reviewed by MoMo — there is no self-serve production key.
key_prefixes:
  documented: false
  note: >-
    Unlike card acquirers, MoMo does not use a test/live key prefix convention
    (no sk_test_/sk_live_ equivalent). The environment is selected by the base
    URL, not by the key, so a key cannot tell you which environment it belongs
    to. That is a real footgun and worth stating.
test_app:
  name: MoMo Test App (developer build)
  download: https://developers.momo.vn/v3/download/
  platforms: [iOS, Android]
  note: >-
    The production MoMo app must be uninstalled before installing the test build.
    On iOS the profile must be trusted under Settings > General > VPN & Device
    Management as "ONLINE MOBILE SERVICE JOIN STOCK COMPANY".
test_wallet:
  phone_number: Create a new test wallet with any well-formed 10-digit Vietnamese number using a real operator prefix
  password: '000000'
  otp: '000000'
  alt_otp: '0000'
  onboarding_steps:
  - Enter a random legitimate 10-digit phone number
  - Enter the default OTP (0000 or 000000)
  - Set a 6-digit password
  - Fill in surname/name, email, gender, nationality = Vietnam
  caveat: >-
    MoMo documents that a newly created test account may hit user restrictions
    during its first 24 hours.
  ekyc: Contact MoMo if the test app demands eKYC information.
funding:
  bank_link:
    recommended_bank: Agribank
    account_number_pattern: 9704 05XX XXXX XXXX (16 digits, X = any digit)
    steps: My Wallet > Manage Card account (or Top up) > select bank > link MoMo wallet to card > enter account number, card holder name, issue date
  topup: Homescreen > Topup > amount > password > default OTP

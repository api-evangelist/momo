description: >-
  MoMo does NOT ship an MCP server. There is no hosted /mcp endpoint on any MoMo
  host (probed payment.momo.vn, test-payment.momo.vn, openapi.momo.vn,
  api.momo.vn, business.momo.vn, developers.momo.vn and www.momo.vn on
  2026-08-26), no MCP package under any MoMo-owned npm scope, no MCP mention
  anywhere in the developer documentation, and no /.well-known/
  oauth-protected-resource anywhere. A third-party listing exists on an MCP
  marketplace under the name "momo-vn"; it is not MoMo's and is not recorded as
  a MoMo surface. The tools below are a CANDIDATE surface derived from MoMo's
  own published Postman operations — what an MCP server for MoMo would expose,
  not something MoMo publishes. No `type: MCPServer` pointer is emitted in
  apis.yml, because emitting one would assert an agent surface that does not
  exist.

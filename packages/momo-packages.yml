third_party_note: >-
  npm and Packagist carry a long tail of community MoMo wrappers (momo-vn,
  @nodepay/momo, @vn-payment/momo, phpviet/omnipay-momo, boolfly/module-momo-wallet
  and others). None are first-party and none are listed here. Note also that many
  "momo" packages on public registries wrap MTN MoMo (Africa), a different company.

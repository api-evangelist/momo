agent_readiness_note: >-
  The blocker for any MoMo MCP server is not the tool list, it is the auth
  model: every AIO v2 call must be HMAC-SHA256 signed over an operation-specific,
  alphabetically ordered field string using a secretKey that must never leave the
  merchant's server. An MCP server for MoMo has to hold that secret and sign on
  the agent's behalf, which makes it a server-side deployment rather than a
  client-side connector.
tools:
- name: create_payment
  description: Create a MoMo payment request and receive payUrl, deeplink and qrCodeUrl.
  source_operation: POST /v2/gateway/api/create
  write: true
  reversible_by: confirm (cancel) before capture; refund after capture
- name: confirm_payment
  description: Capture or cancel a previously authorized (resultCode 9000) transaction.
  source_operation: POST /v2/gateway/api/confirm
  write: true
  parameters_note: requestType is capture or cancel
- name: query_transaction
  description: Read the current status of a transaction by orderId and requestId.

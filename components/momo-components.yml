    Distinct from Component Kits — the native merchant SDK that opens the MoMo
    app from a partner's own iOS/Android app.
  ios: 'MomoiOSSwiftSdk (CocoaPods from git branch release_swift / release_objc)'
  repo: https://github.com/momo-wallet/mobile-sdk
  packages: packages/momo-packages.yml
not_published:
- No web (browser) component library — Component Kits are React Native only.
- No hosted checkout iframe or drop-in element for websites.
- No embedded merchant dashboard or reporting component.
- No CDN/script-tag distribution; every component is an npm package.

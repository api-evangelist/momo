generated: '2026-08-26'
method: searched
source: >-
  https://developers.momo.vn/v3/docs/app-center/development-guideline/components-api-sdk/component-kits/,
  https://www.npmjs.com/org/momo-kits
note: >-
  MoMo publishes a first-party client-side component library — Component Kits —
  for building Mini Apps that render inside the MoMo app. These are React Native
  components, not web embeds: there is no hosted checkout iframe library, no web
  drop-in element and no embedded dashboard product. The payment gateway's
  "embedded" surface is a redirect/deeplink to test-payment.momo.vn or
  payment.momo.vn plus a QR code, not a mountable component.
